<article class="card">

    <div class="card__stage">
        @if (hasLivePreview) {
        <app-live-preview [html]="liveHtml" [css]="liveCss" [js]="liveJs" [title]="title" [tone]="stage"
            [interactive]="false" />
        } @else {
        <div class="card__placeholder" aria-hidden="true"></div>
        }
    </div>

    <footer class="card__foot">
        <div class="card__meta">
            @if (kind) {
            <span class="card__kind" [attr.data-kind]="kind">{{ kind }}</span>
            }
            <span class="card__title">{{ title }}</span>
        </div>

        @if (internalHref) {
        <a class="card__cta" [routerLink]="internalHref">
            {{ visitText }}
        </a>
        } @else if (externalHref) {
        <a class="card__cta" [href]="externalHref" target="_blank" rel="noopener noreferrer">
            {{ visitText }}
        </a>
        }
    </footer>

</article>
