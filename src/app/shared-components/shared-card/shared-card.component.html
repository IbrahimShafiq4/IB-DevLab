<article class="card" [attr.data-kind]="kind || 'component'">

    <div class="card__stage">
        @if (hasLivePreview) {
        <app-live-preview [html]="liveHtml" [css]="liveCss" [js]="liveJs" [title]="title" [tone]="stage"
            [interactive]="false" />
        } @else {
        <div class="card__placeholder" aria-hidden="true">
            <span class="card__placeholder-mark"></span>
        </div>
        }
    </div>

    <div class="card__caption">
        <h3 class="card__title">
            @if (internalHref) {
            <a class="card__title-link" [routerLink]="internalHref">{{ title }}</a>
            } @else if (externalHref) {
            <a class="card__title-link" [href]="externalHref" target="_blank" rel="noopener noreferrer">{{ title }}</a>
            } @else {
            {{ title }}
            }
        </h3>

        @if (internalHref) {
        <a class="card__open" [routerLink]="internalHref" [attr.aria-label]="'عرض الكود: ' + title">
            <span class="card__open-icon" aria-hidden="true">&lt;/&gt;</span>
            <span class="card__open-label">الكود</span>
        </a>
        }
    </div>

</article>
