<section class="row">
    <header class="p-0">
        <div class="nav-wrap">
            <div class="bubble active"></div>
            <div class="bubble hover"></div>
            <nav class="nav main-background">
                <a [class.active_link]="activeTab() === 'all'" (click)="changeTab('all')" role="button"
                    class="tab-link">
                    All
                </a>
                <a [class.active_link]="activeTab() === 'cssbattle'" (click)="changeTab('cssbattle')" role="button"
                    class="tab-link">
                    Css Battle
                </a>
            </nav>
        </div>
    </header>

    <div class="projects-container row" [@tabAnimation]="activeTab()">
        @for (project of paginatedProjects; track $index; let index = $index) {
        <div class="col-md-6 col-12 p-1 project-item">
            <app-shared-card [date]="project.date" [isItCssBattle]="project?.isItCssBattle"
                [isNavigationOnTheWebsite]="project.navigationState" [projectUrl]="project.projectUrl"
                [description]="project.description" [title]="project.title" [videoSrc]="project.videoSrc"
                [tags]="project.tags" [oppositeSideBorder]="index % 2 === 0">
            </app-shared-card>
        </div>
        }

        @if (paginatedProjects.length === 0) {
        <div class="col-12 text-center py-5">
            <h3>No projects found in this category</h3>
            <p>Try selecting a different filter</p>
        </div>
        }
    </div>
</section>
